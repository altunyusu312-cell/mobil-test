name: Build iOS App in Cloud (Zero Mac Required)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: 📥 Proje Kodlarını Çek
        uses: actions/checkout@v4

      - name: 🟢 Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Bağımlılıkları Yükle
        run: |
          npm install

      - name: 📱 Capacitor iOS Projesini Senkronize Et
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: 🛠️ Xcode ile iOS Uygulamasını Derle
        run: |
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 🚀 Derlenen iOS Paketini Arşiv Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Gokturk-iOS-Build
          path: ios/App/build/Release-iphoneos/
          retention-days: 14
